<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#00d4aa">

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="내 웹툰">
  <link rel="apple-touch-icon" href="icon-192.png">

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>내 웹툰</title>
</head>
<body>
<div id="app">

  <!-- iOS Install Banner -->
  <div id="install-banner" class="install-banner hidden">
    <p>📲 홈 화면에 추가하면 앱처럼 쓸 수 있어요!</p>
    <button onclick="dismissInstallBanner()">닫기</button>
  </div>

  <!-- ── HOME ── -->
  <div id="screen-home" class="screen hidden">
    <div id="home-header" class="header">
      <span class="header-logo" onclick="goHomeReset()" style="cursor:pointer">📚 내 웹툰</span>
    </div>
    <div class="search-bar-wrap">
      <input type="search" id="search-input" class="search-input" placeholder="🔍  시리즈 검색..." oninput="onSearch()" onfocus="onSearchFocus()" autocomplete="off" autocorrect="off" spellcheck="false">
    </div>
    <div id="tag-filter-bar" class="tag-filter-bar"></div>
    <div id="home-content"></div>
  </div>

  <!-- ── EPISODE LIST ── -->
  <div id="screen-episodes" class="screen hidden">
    <div id="ep-header-ui" class="header"></div>
    <div id="ep-content"></div>
  </div>

  <!-- ── READER ── -->
  <div id="screen-reader" class="screen hidden">
    <div id="reader-overlay-top" class="reader-overlay-top">
      <button class="r-back-btn" onclick="navigate('episodes',{seriesId:state.seriesId})">‹ 나가기</button>
      <div class="r-titles">
        <div class="r-series" id="reader-series-title"></div>
        <div class="r-episode" id="reader-episode-title"></div>
      </div>
    </div>
    <div id="reader-content"></div>
    <div id="reader-overlay-bottom" class="reader-overlay-bottom">
      <button class="r-nav-btn prev" id="btn-prev-ep" onclick="navigateEpisode(-1)">‹ 이전화</button>
      <button class="r-nav-btn next" id="btn-next-ep" onclick="navigateEpisode(1)">다음화 ›</button>
    </div>
  </div>

  <!-- FAB -->
  <button id="fab" class="fab">＋</button>

  <!-- Progress bar (global) -->
  <div id="progress-bar" class="progress-bar hidden" style="position:fixed;bottom:0;left:0;right:0;z-index:999">
    <div id="progress-fill" class="progress-fill" style="width:0%"></div>
  </div>

  <!-- ── MODAL: 시리즈 추가 ── -->
  <div id="modal-add-series" class="modal-backdrop">
    <div class="modal">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
        <h3 style="margin:0">📚 새 시리즈 만들기</h3>
        <button class="tag-add-btn" onclick="openAddTagModal()">🏷️ 태그 추가</button>
      </div>

      <label>시리즈 이름</label>
      <input type="text" id="series-name-input" placeholder="예) 내 그림 모음, 여행 사진..." maxlength="40">

      <div style="height:12px"></div>
      <label>태그 선택</label>
      <div id="series-tag-selector" class="tag-chips-wrap" style="margin-top:6px"></div>

      <div style="height:12px"></div>
      <label>첫 번째 이미지 (선택)</label>
      <div id="series-pick-area" class="file-pick-area">
        <div class="fp-icon">🖼️</div>
        <p><strong>탭해서 이미지 선택</strong><br>여러 장 한번에 선택 가능</p>
      </div>
      <div id="series-file-count" class="file-count"></div>
      <input type="file" id="series-file-input" accept="image/*" multiple style="display:none" onchange="pickSeriesFiles(event)">

      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="hideModal('modal-add-series')">취소</button>
        <button class="btn btn-confirm" onclick="saveSeries()">만들기</button>
      </div>
    </div>
  </div>

  <!-- ── MODAL: 태그 만들기 ── -->
  <div id="modal-add-tag" class="modal-backdrop">
    <div class="modal">
      <h3>🏷️ 새 태그 만들기</h3>
      <label>태그 이름</label>
      <input type="text" id="new-tag-input" placeholder="예) 액션, 로맨스, 내 그림..." maxlength="20">
      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="hideModal('modal-add-tag')">취소</button>
        <button class="btn btn-confirm" onclick="saveNewTag()">만들기</button>
      </div>
    </div>
  </div>

  <!-- ── MODAL: 회차 추가 ── -->
  <div id="modal-add-episode" class="modal-backdrop">
    <div class="modal">
      <h3>🗂️ 회차 추가</h3>

      <label>회차 이름</label>
      <input type="text" id="ep-name-input" placeholder="예) 1화, 챕터 1, 2024년 1월..." maxlength="40">

      <div style="height:14px"></div>
      <label>이미지 선택 <span style="color:var(--danger)">*</span></label>
      <div id="ep-pick-area" class="file-pick-area">
        <div class="fp-icon">📂</div>
        <p><strong>탭해서 이미지 선택</strong><br>여러 장 한번에 선택 가능<br><span style="font-size:12px;color:#666">파일 이름 순서대로 표시됩니다</span></p>
      </div>
      <div id="ep-file-count" class="file-count"></div>
      <input type="file" id="ep-file-input" accept="image/*" multiple style="display:none" onchange="pickEpFiles(event)">

      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="hideModal('modal-add-episode')">취소</button>
        <button class="btn btn-confirm" onclick="saveEpisode()">저장</button>
      </div>
    </div>
  </div>

  <!-- ── CONTEXT MENU ── -->
  <div id="ctx-menu" class="ctx-menu">
    <div id="ctx-cover" class="ctx-item" onclick="ctxChangeCover()">🖼️ 표지 변경하기</div>
    <div id="ctx-rename" class="ctx-item" onclick="ctxRename()">✏️ 이름 변경</div>
    <div id="ctx-delete" class="ctx-item danger" onclick="ctxDelete()">🗑️ 삭제</div>
  </div>

  <!-- ── COVER EDITOR ── -->
  <div id="cover-editor" class="cover-editor-backdrop">
    <div class="cover-editor-header">
      <button onclick="closeCoverEditor()">취소</button>
      <span>표지 편집</span>
      <button class="save-btn" onclick="saveCoverEdit()">저장</button>
    </div>
    <div class="cover-editor-body" id="cover-editor-body">
      <canvas id="cover-canvas"></canvas>
      <div class="cover-frame" id="cover-frame"></div>
      <div class="cover-frame-hint">두 손가락으로 확대/축소 · 드래그로 이동</div>
    </div>
    <input type="file" id="cover-file-input" accept="image/*" style="display:none" onchange="onCoverFileSelected(event)">
  </div>

  <!-- ── CONFIRM MODAL ── -->
  <div id="modal-confirm" class="modal-backdrop">
    <div class="modal">
      <h3 id="confirm-title">삭제할까요?</h3>
      <p id="confirm-msg" style="color:var(--text2);font-size:14px;line-height:1.6;margin-bottom:4px"></p>
      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="confirmResolve(false)">취소</button>
        <button class="btn btn-confirm danger" style="background:var(--danger);color:#fff" onclick="confirmResolve(true)">삭제</button>
      </div>
    </div>
  </div>

  <!-- ── RENAME MODAL ── -->
  <div id="modal-rename" class="modal-backdrop">
    <div class="modal">
      <h3>✏️ 이름 변경</h3>
      <label id="rename-label">이름</label>
      <input type="text" id="rename-input" maxlength="40" style="margin-top:6px">
      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="renameResolve(null)">취소</button>
        <button class="btn btn-confirm" onclick="renameResolve(document.getElementById('rename-input').value)">확인</button>
      </div>
    </div>
  </div>

</div>
<script src="app.js"></script>
</body>
</html>
