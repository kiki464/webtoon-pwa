<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#00d4aa">

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="내 웹툰">
  <link rel="apple-touch-icon" href="icon-192.png">

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>내 웹툰</title>
</head>
<body>
<div id="app">

  <!-- iOS Install Banner -->
  <div id="install-banner" class="install-banner hidden">
    <p>📲 홈 화면에 추가하면 앱처럼 쓸 수 있어요!</p>
    <button onclick="dismissInstallBanner()">닫기</button>
  </div>

  <!-- ── HOME ── -->
  <div id="screen-home" class="screen hidden">
    <div id="home-header" class="header"></div>
    <div id="home-content"></div>
  </div>

  <!-- ── EPISODE LIST ── -->
  <div id="screen-episodes" class="screen hidden">
    <div id="ep-header-ui" class="header"></div>
    <div id="ep-content"></div>
  </div>

  <!-- ── READER ── -->
  <div id="screen-reader" class="screen hidden">
    <div id="reader-header" class="header"></div>
    <div id="reader-content"></div>
  </div>

  <!-- FAB -->
  <button id="fab" class="fab">＋</button>

  <!-- Progress bar (global) -->
  <div id="progress-bar" class="progress-bar hidden" style="position:fixed;bottom:0;left:0;right:0;z-index:999">
    <div id="progress-fill" class="progress-fill" style="width:0%"></div>
  </div>

  <!-- ── MODAL: 시리즈 추가 ── -->
  <div id="modal-add-series" class="modal-backdrop">
    <div class="modal">
      <h3>📚 새 시리즈 만들기</h3>

      <label>시리즈 이름</label>
      <input type="text" id="series-name-input" placeholder="예) 내 그림 모음, 여행 사진..." maxlength="40">

      <div style="height:14px"></div>
      <label>첫 번째 이미지 (선택)</label>
      <div id="series-pick-area" class="file-pick-area">
        <div class="fp-icon">🖼️</div>
        <p><strong>탭해서 이미지 선택</strong><br>여러 장 한번에 선택 가능</p>
      </div>
      <div id="series-file-count" class="file-count"></div>
      <input type="file" id="series-file-input" accept="image/*" multiple style="display:none" onchange="pickSeriesFiles(event)">

      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="hideModal('modal-add-series')">취소</button>
        <button class="btn btn-confirm" onclick="saveSeries()">만들기</button>
      </div>
    </div>
  </div>

  <!-- ── MODAL: 회차 추가 ── -->
  <div id="modal-add-episode" class="modal-backdrop">
    <div class="modal">
      <h3>🗂️ 회차 추가</h3>

      <label>회차 이름</label>
      <input type="text" id="ep-name-input" placeholder="예) 1화, 챕터 1, 2024년 1월..." maxlength="40">

      <div style="height:14px"></div>
      <label>이미지 선택 <span style="color:var(--danger)">*</span></label>
      <div id="ep-pick-area" class="file-pick-area">
        <div class="fp-icon">📂</div>
        <p><strong>탭해서 이미지 선택</strong><br>여러 장 한번에 선택 가능<br><span style="font-size:12px;color:#666">파일 이름 순서대로 표시됩니다</span></p>
      </div>
      <div id="ep-file-count" class="file-count"></div>
      <input type="file" id="ep-file-input" accept="image/*" multiple style="display:none" onchange="pickEpFiles(event)">

      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="hideModal('modal-add-episode')">취소</button>
        <button class="btn btn-confirm" onclick="saveEpisode()">저장</button>
      </div>
    </div>
  </div>

  <!-- ── CONTEXT MENU ── -->
  <div id="ctx-menu" class="ctx-menu">
    <div id="ctx-rename" class="ctx-item" onclick="ctxRename()">✏️ 이름 변경</div>
    <div id="ctx-delete" class="ctx-item danger" onclick="ctxDelete()">🗑️ 삭제</div>
  </div>

</div>
<script src="app.js"></script>
</body>
</html>
